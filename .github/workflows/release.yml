name: Release Android & iOS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release existente (ex.: v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename and attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          APK_NAME="GotaSolidaria-${TAG}-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "GotaSolidária $TAG" --generate-notes
          gh release upload "$TAG" "$APK_NAME" --clobber

  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS release (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA and attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          IPA_NAME="GotaSolidaria-${TAG}-ios-unsigned.ipa"
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -y "$IPA_NAME" Payload
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "GotaSolidária $TAG" --generate-notes
          gh release upload "$TAG" "$IPA_NAME" --clobber
